# Kafka: 3 nodes in KRaft combined mode (broker + controller), no ZooKeeper.
#
# Listeners per node N:
#   INTERNAL   kafka-N:29092        -> containers on the infra-net docker network
#   EXTERNAL   ${HOST_IP}:909(1+N)  -> other VMs / GKE / laptop via Tailscale
#   CONTROLLER kafka-N:29093        -> raft quorum, never published

x-kafka-node: &kafka-node
  image: ${KAFKA_IMAGE}
  restart: unless-stopped
  mem_limit: ${KAFKA_MEM_LIMIT}
  networks: [infra-net]
  ulimits:
    nofile: { soft: 100000, hard: 100000 }
  depends_on:
    kafka-volume-init: { condition: service_completed_successfully }

x-kafka-env: &kafka-env
  CLUSTER_ID: ${KAFKA_CLUSTER_ID}
  KAFKA_HEAP_OPTS: ${KAFKA_HEAP_OPTS}
  KAFKA_PROCESS_ROLES: broker,controller
  KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29093,2@kafka-2:29093,3@kafka-3:29093
  KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
  KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:19092,CONTROLLER://:29093
  KAFKA_LOG_DIRS: /var/lib/kafka/data
  # Durability defaults for a 3-node cluster
  KAFKA_DEFAULT_REPLICATION_FACTOR: 3
  KAFKA_MIN_INSYNC_REPLICAS: 2
  KAFKA_NUM_PARTITIONS: 3
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
  KAFKA_LOG_RETENTION_HOURS: 168
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

x-kafka-health: &kafka-health
  interval: 20s
  timeout: 15s
  retries: 10
  start_period: 40s

services:
  # Named volumes are created root-owned; the kafka image runs as appuser.
  kafka-volume-init:
    image: ${KAFKA_IMAGE}
    container_name: kafka-volume-init
    restart: "no"
    user: "0:0"
    entrypoint: ["sh", "-c", "chown -R appuser:appuser /v1 /v2 /v3"]
    volumes:
      - kafka-1-data:/v1
      - kafka-2-data:/v2
      - kafka-3-data:/v3

  kafka-1:
    <<: *kafka-node
    container_name: kafka-1
    hostname: kafka-1
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:29092,EXTERNAL://${HOST_IP}:9092
    ports: ["9092:19092"]
    volumes: [kafka-1-data:/var/lib/kafka/data]
    healthcheck:
      <<: *kafka-health
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx128m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka-1:29092 >/dev/null 2>&1"]

  kafka-2:
    <<: *kafka-node
    container_name: kafka-2
    hostname: kafka-2
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:29092,EXTERNAL://${HOST_IP}:9093
    ports: ["9093:19092"]
    volumes: [kafka-2-data:/var/lib/kafka/data]
    healthcheck:
      <<: *kafka-health
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx128m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka-2:29092 >/dev/null 2>&1"]

  kafka-3:
    <<: *kafka-node
    container_name: kafka-3
    hostname: kafka-3
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:29092,EXTERNAL://${HOST_IP}:9094
    ports: ["9094:19092"]
    volumes: [kafka-3-data:/var/lib/kafka/data]
    healthcheck:
      <<: *kafka-health
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx128m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka-3:29092 >/dev/null 2>&1"]

  # Web UI on :8080 — reach it over Tailscale only.
  kafka-ui:
    image: ${KAFKA_UI_IMAGE}
    container_name: kafka-ui
    restart: unless-stopped
    mem_limit: 384m
    networks: [infra-net]
    ports: ["8080:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: infralab
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka-1: { condition: service_healthy }
      kafka-2: { condition: service_healthy }
      kafka-3: { condition: service_healthy }

networks:
  infra-net:
    external: true

volumes:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
