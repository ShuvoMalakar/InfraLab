# Redis Cluster: 3 masters + 3 replicas.
# Every node announces ${HOST_IP}:700N, so the slot map and MOVED redirects
# work for clients on this VM, in the VPC, and over Tailscale.
# Node config is rendered by start-node.sh from env vars.

x-redis-node: &redis-node
  image: ${REDIS_IMAGE}
  restart: unless-stopped
  mem_limit: ${REDIS_MEM_LIMIT}
  networks: [infra-net]
  entrypoint: ["sh", "/start-node.sh"]

x-redis-env: &redis-env
  HOST_IP: ${HOST_IP}
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  REDISCLI_AUTH: ${REDIS_PASSWORD}
  REDIS_MAXMEMORY: ${REDIS_MAXMEMORY}

services:
  redis-1:
    <<: *redis-node
    container_name: redis-1
    environment: { <<: *redis-env, NODE_PORT: "7001" }
    ports: ["7001:7001", "17001:17001"]
    volumes: ["redis-1-data:/data", "./start-node.sh:/start-node.sh:ro"]
    healthcheck: { test: ["CMD", "redis-cli", "-p", "7001", "ping"], interval: 5s, timeout: 3s, retries: 10 }

  redis-2:
    <<: *redis-node
    container_name: redis-2
    environment: { <<: *redis-env, NODE_PORT: "7002" }
    ports: ["7002:7002", "17002:17002"]
    volumes: ["redis-2-data:/data", "./start-node.sh:/start-node.sh:ro"]
    healthcheck: { test: ["CMD", "redis-cli", "-p", "7002", "ping"], interval: 5s, timeout: 3s, retries: 10 }

  redis-3:
    <<: *redis-node
    container_name: redis-3
    environment: { <<: *redis-env, NODE_PORT: "7003" }
    ports: ["7003:7003", "17003:17003"]
    volumes: ["redis-3-data:/data", "./start-node.sh:/start-node.sh:ro"]
    healthcheck: { test: ["CMD", "redis-cli", "-p", "7003", "ping"], interval: 5s, timeout: 3s, retries: 10 }

  redis-4:
    <<: *redis-node
    container_name: redis-4
    environment: { <<: *redis-env, NODE_PORT: "7004" }
    ports: ["7004:7004", "17004:17004"]
    volumes: ["redis-4-data:/data", "./start-node.sh:/start-node.sh:ro"]
    healthcheck: { test: ["CMD", "redis-cli", "-p", "7004", "ping"], interval: 5s, timeout: 3s, retries: 10 }

  redis-5:
    <<: *redis-node
    container_name: redis-5
    environment: { <<: *redis-env, NODE_PORT: "7005" }
    ports: ["7005:7005", "17005:17005"]
    volumes: ["redis-5-data:/data", "./start-node.sh:/start-node.sh:ro"]
    healthcheck: { test: ["CMD", "redis-cli", "-p", "7005", "ping"], interval: 5s, timeout: 3s, retries: 10 }

  redis-6:
    <<: *redis-node
    container_name: redis-6
    environment: { <<: *redis-env, NODE_PORT: "7006" }
    ports: ["7006:7006", "17006:17006"]
    volumes: ["redis-6-data:/data", "./start-node.sh:/start-node.sh:ro"]
    healthcheck: { test: ["CMD", "redis-cli", "-p", "7006", "ping"], interval: 5s, timeout: 3s, retries: 10 }

  # One-shot: forms the cluster on first boot, no-op afterwards.
  redis-cluster-init:
    image: ${REDIS_IMAGE}
    container_name: redis-cluster-init
    restart: "no"
    networks: [infra-net]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
      HOST_IP: ${HOST_IP}
    volumes: ["./init-cluster.sh:/init-cluster.sh:ro"]
    entrypoint: ["sh", "/init-cluster.sh"]
    depends_on:
      redis-1: { condition: service_healthy }
      redis-2: { condition: service_healthy }
      redis-3: { condition: service_healthy }
      redis-4: { condition: service_healthy }
      redis-5: { condition: service_healthy }
      redis-6: { condition: service_healthy }

  # Web UI on :5540 — reach it over Tailscale only. Add the cluster with
  # host=${HOST_IP} port=7001 password=${REDIS_PASSWORD}.
  redisinsight:
    image: ${REDISINSIGHT_IMAGE}
    container_name: redisinsight
    restart: unless-stopped
    mem_limit: 256m
    networks: [infra-net]
    ports: ["5540:5540"]
    volumes: [redisinsight-data:/data]

networks:
  infra-net:
    external: true

volumes:
  redis-1-data:
  redis-2-data:
  redis-3-data:
  redis-4-data:
  redis-5-data:
  redis-6-data:
  redisinsight-data:
