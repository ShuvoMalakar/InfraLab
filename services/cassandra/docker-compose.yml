# Cassandra: 3-node cluster, one datacenter (dc1).
#
# Addresses:
#   gossip / internode (7000)  -> container IPs on infra-net, never published
#   CQL clients                -> ${HOST_IP}:9042, 9043, 9044 (one port per node)
#
# Every node advertises broadcast_rpc_address=${HOST_IP} plus its own native
# port. Cassandra stores that port in system.peers_v2, so modern drivers find
# all 3 nodes from any one contact point.
#
# Nodes start ONE AT A TIME (2 waits for 1, 3 waits for 2), because Cassandra
# does not allow nodes to join the cluster at the same moment. A cold start
# takes about 3-5 minutes.

x-cassandra-node: &cassandra-node
  image: ${CASSANDRA_IMAGE:-cassandra:5.0.2}
  restart: unless-stopped
  mem_limit: ${CASSANDRA_MEM_LIMIT:-1280m}
  networks: [infra-net]
  ulimits:
    nofile: { soft: 100000, hard: 100000 }
    memlock: { soft: -1, hard: -1 }

x-cassandra-env: &cassandra-env
  CASSANDRA_CLUSTER_NAME: infralab
  CASSANDRA_SEEDS: cassandra-1
  CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
  CASSANDRA_DC: dc1
  CASSANDRA_RACK: rack1
  CASSANDRA_NUM_TOKENS: "16"
  CASSANDRA_RPC_ADDRESS: 0.0.0.0
  CASSANDRA_BROADCAST_RPC_ADDRESS: ${HOST_IP}
  MAX_HEAP_SIZE: ${CASSANDRA_MAX_HEAP:-512M}
  HEAP_NEWSIZE: ${CASSANDRA_HEAP_NEWSIZE:-128M}

x-cassandra-health: &cassandra-health
  interval: 15s
  timeout: 10s
  retries: 20
  start_period: 120s

services:
  cassandra-1:
    <<: *cassandra-node
    container_name: cassandra-1
    hostname: cassandra-1
    environment:
      <<: *cassandra-env
      JVM_EXTRA_OPTS: -Dcassandra.native_transport_port=9042
    ports: ["9042:9042"]
    volumes: [cassandra-1-data:/var/lib/cassandra]
    healthcheck:
      <<: *cassandra-health
      test: ["CMD-SHELL", "cqlsh 127.0.0.1 9042 -e 'SELECT release_version FROM system.local' >/dev/null 2>&1"]

  cassandra-2:
    <<: *cassandra-node
    container_name: cassandra-2
    hostname: cassandra-2
    environment:
      <<: *cassandra-env
      JVM_EXTRA_OPTS: -Dcassandra.native_transport_port=9043
    ports: ["9043:9043"]
    volumes: [cassandra-2-data:/var/lib/cassandra]
    healthcheck:
      <<: *cassandra-health
      test: ["CMD-SHELL", "cqlsh 127.0.0.1 9043 -e 'SELECT release_version FROM system.local' >/dev/null 2>&1"]
    depends_on:
      cassandra-1: { condition: service_healthy }

  cassandra-3:
    <<: *cassandra-node
    container_name: cassandra-3
    hostname: cassandra-3
    environment:
      <<: *cassandra-env
      JVM_EXTRA_OPTS: -Dcassandra.native_transport_port=9044
    ports: ["9044:9044"]
    volumes: [cassandra-3-data:/var/lib/cassandra]
    healthcheck:
      <<: *cassandra-health
      test: ["CMD-SHELL", "cqlsh 127.0.0.1 9044 -e 'SELECT release_version FROM system.local' >/dev/null 2>&1"]
    depends_on:
      cassandra-2: { condition: service_healthy }

networks:
  infra-net:
    external: true

volumes:
  cassandra-1-data:
  cassandra-2-data:
  cassandra-3-data:
